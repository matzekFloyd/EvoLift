<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset your EvoLift password</title>
  </head>
  <body style="margin:0;padding:0;background-color:#fafafa;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#fafafa;">
      <tr>
        <td align="center" style="padding:24px 16px;">
          <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;background-color:#ffffff;border:1px solid #e4e4e7;">
            <tr>
              <td style="padding:24px 24px 8px 24px;font-family:Arial,Helvetica,sans-serif;font-size:18px;line-height:24px;font-weight:bold;color:#0369a1;">
                EvoLift
              </td>
            </tr>
            <tr>
              <td style="padding:8px 24px 20px 24px;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:24px;color:#18181b;">
                Reset your password to get back into your EvoLift account.
              </td>
            </tr>
            <tr>
              <td style="padding:0 24px 16px 24px;">
                <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td align="center" bgcolor="#0369a1" style="background-color:#0369a1;border-radius:6px;">
                      <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:12px 20px;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:20px;font-weight:bold;color:#ffffff;text-decoration:none;background-color:#0369a1;border-radius:6px;">Reset password</a>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding:0 24px 16px 24px;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:20px;color:#0369a1;word-break:break-all;">
                <a href="{{ .ConfirmationURL }}" style="color:#0369a1;text-decoration:underline;">{{ .ConfirmationURL }}</a>
              </td>
            </tr>
            <tr>
              <td style="padding:0 24px 24px 24px;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:20px;color:#52525b;">
                If you did not ask to reset your password, you can ignore this email.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
