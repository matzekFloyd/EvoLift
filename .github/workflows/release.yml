name: Release

# When the product version in app-version.json lands on master, publish a
# GitHub Release tagged vMAJOR.MINOR.PATCH (same label as the site footer).
# See VERSIONING.md.

on:
  push:
    branches: ["master"]
    paths:
      - evo-lift/app-version.json

# Only this workflow needs write: create the release tag/notes via GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Read product version
        id: version
        run: |
          set -euo pipefail
          TAG="$(node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            import { releaseTagFromAppVersionJson } from './shell/github-release.mjs';
            const json = JSON.parse(readFileSync('evo-lift/app-version.json', 'utf8'));
            process.stdout.write(releaseTagFromAppVersionJson(json));
          ")"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Product release tag: ${TAG}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --target "$GITHUB_SHA"
