name: npm audit

# Required PR check (ruleset). No push-to-master re-run — merges already passed this.
on:
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  audit:
    name: Production dependency advisories
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            evo-lift/package-lock.json
            mcp/evo-api/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install evo-lift dependencies
        working-directory: evo-lift
        run: npm ci

      - name: Install mcp/evo-api dependencies
        working-directory: mcp/evo-api
        run: npm ci

      - name: Fail on high/critical production advisories
        run: node scripts/npm-audit-ci.mjs
