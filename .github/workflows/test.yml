name: Test

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  test:
    name: npm test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: evo-lift/package-lock.json

      - name: Test Android shell and release helpers
        run: npm test

      - name: Install dependencies
        working-directory: evo-lift
        run: npm ci

      - name: Run tests
        working-directory: evo-lift
        run: npm test

  api:
    name: API integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: evo-lift/package-lock.json

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.98.2

      - name: Install dependencies
        working-directory: evo-lift
        run: npm ci

      - name: Start local Supabase
        run: supabase start

      - name: Apply migrations and catalog seeds
        run: |
          supabase db reset --no-seed --yes
          supabase db query --local --file supabase/seeds/001_exercises.sql
          supabase db query --local --file supabase/seeds/002_exercise_translations.sql

      - name: Export local Supabase env
        run: |
          set -euo pipefail
          supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=' > /tmp/supabase.env
          set -a
          source /tmp/supabase.env
          set +a
          echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY}" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}" >> "$GITHUB_ENV"

      - name: Run API integration tests
        working-directory: evo-lift
        run: npm run test:integration
