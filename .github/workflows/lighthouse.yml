name: Lighthouse

on:
  push:
    branches: ["master"]

permissions:
  contents: read

jobs:
  lighthouse:
    name: Performance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: evo-lift/package-lock.json

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.121.0

      - name: Install dependencies
        working-directory: evo-lift
        run: npm ci

      - name: Start local Supabase
        run: supabase start

      - name: Apply migrations and catalog seeds
        run: |
          supabase db reset --no-seed --yes
          supabase db query --local --file supabase/seeds/001_exercises.sql
          supabase db query --local --file supabase/seeds/002_exercise_translations.sql

      - name: Export local Supabase env
        run: |
          set -euo pipefail
          supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=' > /tmp/supabase.env
          set -a
          source /tmp/supabase.env
          set +a
          echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY}" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}" >> "$GITHUB_ENV"

      - name: Seed local demo user
        working-directory: evo-lift
        run: npm run seed:local

      - name: Build app
        working-directory: evo-lift
        run: npm run build

      - name: Run Lighthouse performance checks
        working-directory: evo-lift
        run: npm run lighthouse

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: evo-lift/.lighthouseci/
          # Dot-directories are skipped unless this is true.
          include-hidden-files: true
          if-no-files-found: warn
