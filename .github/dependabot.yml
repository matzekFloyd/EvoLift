# Weekly dependency and Actions update PRs (OWASP A03 / A08 — supply chain).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - security
    groups:
      capacitor:
        patterns:
          - "@capacitor/*"

  - package-ecosystem: npm
    directory: /evo-lift
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 15
    labels:
      - dependencies
      - security
    groups:
      # First match wins. eslint-config-next must stay with next, not eslint.
      next:
        patterns:
          - "next"
          - "@next/*"
          - "eslint-config-next"
      react:
        patterns:
          - "react"
          - "react-dom"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/postcss"
      eslint:
        patterns:
          - "eslint*"
        exclude-patterns:
          - "eslint-config-next"
      types:
        patterns:
          - "@types/*"

  - package-ecosystem: npm
    directory: /mcp/evo-api
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      # init and analyze are separate dependencies but must share one
      # release. A split bump fails CodeQL with a version mismatch.
      # applies-to defaults to version updates, so security updates
      # need their own group or they still open one PR per step.
      codeql-action:
        patterns:
          - "github/codeql-action"
          - "github/codeql-action/*"
      codeql-action-security:
        applies-to: security-updates
        patterns:
          - "github/codeql-action"
          - "github/codeql-action/*"
